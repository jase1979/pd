    spec_point: "1.1.28"
    concept: standard-lengths
    command: state
    see: "#sectional-forms-and-standard-sizes-of-natural-timber"
    text: "Softwood standard lengths usually rise in steps of how much?"
    options:
      - text: "300 mm"
      - text: "100 mm"
        why_wrong: "The steps are larger: 300 mm, e.g. 1.8 m, 2.1 m, 2.4 m."
      - text: "500 mm"
        why_wrong: "The steps are 300 mm."
      - text: "1 m"
        why_wrong: "The steps are 300 mm."
    answer: 0
    explanation: "Softwood lengths rise in 300 mm steps, such as 1.8, 2.1, 2.4, 2.7 and 3.0 m."

  - id: dt26-stock-005
    type: two_tier
    status: reviewed
    spec_point: "1.1.28"
    concept: sawn-vs-planed
    command: explain
    scenario: garden-planter
    see: "#sawn-and-planed-timber"
    text: "Which timber suits the indoor shelf unit?"
    options:
      - text: "Planed timber"
      - text: "Sawn timber"
        why_wrong: "Sawn timber is rough, with visible saw marks. It suits hidden or outdoor structural work."
      - text: "Hardboard"
        why_wrong: "Hardboard is a thin manufactured board, not solid timber."
      - text: "Rough-cut logs"
        why_wrong: "Logs aren't a stock form for furniture."
    answer: 0
    reason:
      text: "Why?"
      options:
        - text: "It's smooth on all faces, ready for visible furniture"
        - text: "It's cheaper"
          why_wrong: "Planed timber costs more because of the extra processing."
        - text: "It's larger than its nominal size"
          why_wrong: "Planed timber is smaller than its nominal size."
        - text: "It has visible saw marks"
          why_wrong: "That's sawn timber."
      answer: 0
    explanation: "Planed timber is smooth on all faces and used for furniture and visible woodwork. It costs more than sawn."

  - id: dt26-stock-006
    status: reviewed
    spec_point: "1.1.28"
    concept: nominal-size
    command: describe
    scenario: garden-planter
    see: "#sawn-and-planed-timber"
    text: "The designer buys '50 × 25 mm' planed pine for the shelves. What should they expect?"
    options:
      - text: "It will measure a few millimetres less, so they should check the actual size"
      - text: "It will be exactly 50 × 25 mm"
        why_wrong: "Planing removes a few millimetres from each face."
      - text: "It will be larger"
        why_wrong: "Planing makes it smaller, not larger."
      - text: "It will be rough"
        why_wrong: "Planed timber is smooth."
    answer: 0
    explanation: "Planed timber is smaller than its nominal sawn size, so check the actual size when designing joints."

  - id: dt26-stock-007
    status: reviewed
    spec_point: "1.1.28"
    concept: par
    command: state
    see: "#sawn-and-planed-timber"
    text: "What does PAR stand for?"
    options:
      - text: "Planed all round"
      - text: "Pine and redwood"
        why_wrong: "PAR describes how the timber is finished, not the species."
      - text: "Partly rough"
        why_wrong: "PAR timber is planed smooth on all four faces."
      - text: "Plywood and resin"
        why_wrong: "PAR is a term for natural timber."
    answer: 0
    explanation: "PAR is timber planed smooth on all four faces."

  - id: dt26-stock-008
    status: reviewed
    spec_point: "1.1.28"
    concept: sheet-size
    command: state
    scenario: flat-pack-desk
    see: "#manufactured-boards-sheets-standard-sizes-and-thicknesses"
    text: "What is the full standard size of the MDF sheets the desk panels are cut from?"
    options:
      - text: "2440 × 1220 mm"
      - text: "1220 × 610 mm"
        why_wrong: "That's a half sheet."
      - text: "3000 × 1500 mm"
        why_wrong: "The standard is 2440 × 1220 mm (8 ft × 4 ft)."
      - text: "1000 × 1000 mm"
        why_wrong: "The standard is 2440 × 1220 mm."
    answer: 0
    explanation: "The standard full sheet is 2440 × 1220 mm (8 ft × 4 ft). Half sheets are 1220 × 610 mm."

  - id: dt26-stock-009
    type: two_tier
    status: reviewed
    spec_point: "1.1.28"
    concept: nesting
    command: explain
    scenario: flat-pack-desk
    see: "#manufactured-boards-sheets-standard-sizes-and-thicknesses"
    text: "What should the designers do to waste as little MDF as possible when cutting the desk panels?"
    options:
      - text: "Nest the parts on the standard sheet, allowing for the kerf"
      - text: "Cut each part from a new sheet"
        why_wrong: "That wastes most of every sheet."
      - text: "Make every part a different, non-standard size"
        why_wrong: "Random sizes make nesting harder."
      - text: "Use thicker MDF"
        why_wrong: "Thickness doesn't reduce waste."
    answer: 0
    reason:
      text: "What is the kerf?"
      options:
        - text: "The width of material removed by each saw cut"
        - text: "The edge of the sheet"
          why_wrong: "Kerf is the width of the cut, not the edge."
        - text: "A type of knock-down fitting"
          why_wrong: "Kerf is about cutting."
        - text: "The grain direction"
          why_wrong: "MDF has no grain."
      answer: 0
    explanation: "Nesting lays parts out to fill the sheet. Allowing for the kerf stops parts coming out undersized."

  - id: dt26-stock-010
    status: reviewed
    spec_point: "1.1.28"
    concept: board-grades
    command: identify
    context: true
    see: "#manufactured-boards-sheets-standard-sizes-and-thicknesses"
    text: "Which board grade would be best for a bathroom cabinet?"
    options:
      - text: "Moisture-resistant MDF"
      - text: "Standard MDF"
        why_wrong: "Standard MDF swells in damp conditions."
      - text: "Hardboard"
        why_wrong: "Hardboard is thin and not moisture resistant."
      - text: "Flexible plywood"
        why_wrong: "Flexible ply is for curves, not damp areas."
    answer: 0
    explanation: "Special grades include moisture-resistant MDF, exterior or marine ply, and flexible ply."

  - id: dt26-stock-011
    type: multi
    status: reviewed
    spec_point: "1.1.28"
    concept: standard-components
    command: identify
    see: "#standardised-fixtures-and-fittings-including-knock-down-fittings"
    text: "Select TWO reasons for using standard components."
    options:
      - text: "Mass production keeps them cheap"
      - text: "They're consistent and easy to replace"
      - text: "Each one is custom made for the product"
        why_wrong: "Standard components are made in large quantities to agreed sizes."
      - text: "They always look unique"
        why_wrong: "They're standardised, not unique."
    answer: [0, 1]
    explanation: "Standard components are cheaper, reliable, made to BSI or ISO sizes, easy to replace, and save design time."

  - id: dt26-stock-012
    status: reviewed
    spec_point: "1.1.28"
    concept: kdf
    command: describe
    scenario: flat-pack-desk
    see: "#standardised-fixtures-and-fittings-including-knock-down-fittings"
    text: "What is a knock-down fitting?"
    options:
      - text: "A fixing that lets a product be assembled and taken apart using simple tools"
      - text: "A permanent glued joint"
        why_wrong: "KDFs can be undone. Glue is permanent."
      - text: "A fitting that breaks if knocked"
        why_wrong: "'Knock-down' means it can be taken apart."
      - text: "A type of hinge"
        why_wrong: "Hinges are a separate standard component."
    answer: 0
    explanation: "KDFs let products be assembled and dismantled with simple tools. They're the basis of flat-pack furniture."

  - id: dt26-stock-013
    status: reviewed
    spec_point: "1.1.28"
    concept: cam-lock
    command: identify
    scenario: flat-pack-desk
    see: "#standardised-fixtures-and-fittings-including-knock-down-fittings"
    text: "A metal dowel in one panel locks into a round fitting in the other when it's turned. Which KDF is this?"
    options:
      - text: "Cam lock"
      - text: "Corner block"
        why_wrong: "A corner block is screwed into both panels."
      - text: "Threaded insert"
        why_wrong: "A threaded insert gives wood an internal thread for a bolt."
      - text: "Butt hinge"
        why_wrong: "A hinge allows movement. It doesn't lock panels."
    answer: 0
    explanation: "A cam lock's metal dowel locks into a round cam when the cam is turned."

