    type: multi
    status: reviewed
    spec_point: "1.1.28"
    concept: kdf-pros-cons
    command: identify
    scenario: flat-pack-desk
    see: "#standardised-fixtures-and-fittings-including-knock-down-fittings"
    text: "Select TWO advantages of using KDFs for the desk."
    options:
      - text: "It can be flat-packed, saving space and transport cost"
      - text: "It can be taken apart to move or repair"
      - text: "The joints are stronger than glued joints"
        why_wrong: "KDF joints are usually weaker than glued joints."
      - text: "They never work loose"
        why_wrong: "KDF joints can work loose."
