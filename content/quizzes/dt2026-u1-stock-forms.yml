scenarios:
  - id: flat-pack-desk
    text: "A company is designing a flat-pack desk made from MDF panels, to be sold online and assembled by the customer."
  - id: garden-planter
    text: "A designer is making a softwood garden planter, and a smooth pine shelf unit for indoors."

questions:

  - id: dt26-stock-001
    status: reviewed
    spec_point: "1.1.28"
    concept: stock-form
    command: describe
    see: "#sectional-forms-and-standard-sizes-of-natural-timber"
    text: "Why do designers use materials in standard stock sizes?"
    options:
      - text: "They are cheaper, easier to get, and parts can be planned to fit with little waste"
      - text: "They are always stronger"
        why_wrong: "Size doesn't change a material's strength."
      - text: "They never need cutting"
        why_wrong: "Stock is usually cut to size."
      - text: "The law requires it"
        why_wrong: "It's a practical and economic choice."
    answer: 0
    explanation: "Standard sizes keep materials cheaper and easier to obtain, and let designers plan for little waste."

  - id: dt26-stock-002
    status: reviewed
    spec_point: "1.1.28"
    concept: sectional-forms
    command: identify
    context: true
    see: "#sectional-forms-and-standard-sizes-of-natural-timber"
    text: "Which timber section would you buy to make the round rail of a towel holder?"
    options:
      - text: "Dowel"
      - text: "Plank"
        why_wrong: "A plank is wide and thick, with a rectangular section."
      - text: "Board"
        why_wrong: "A board is wide and thin."
      - text: "Strip"
        why_wrong: "A strip is narrow and thin, with a rectangular section."
    answer: 0
    explanation: "Dowel is a long round section, roughly 6–25 mm in diameter, used for rails, pegs, handles and axles."

  - id: dt26-stock-003
    status: reviewed
    spec_point: "1.1.28"
    concept: size-notation
    command: describe
    see: "#sectional-forms-and-standard-sizes-of-natural-timber"
    text: "What does '95 × 22 mm' mean for a piece of timber?"
    options:
      - text: "95 mm wide and 22 mm thick"
      - text: "95 mm long and 22 mm wide"
        why_wrong: "Length is given separately. 95 × 22 is width × thickness."
      - text: "95 cm wide and 22 cm thick"
        why_wrong: "The units are millimetres."
      - text: "22 mm wide and 95 mm thick"
        why_wrong: "Width comes first, then thickness."
    answer: 0
    explanation: "Timber sizes are given as width × thickness, with the length stated separately."

  - id: dt26-stock-004
