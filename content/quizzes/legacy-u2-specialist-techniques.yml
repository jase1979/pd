  - id: tech-021
    type: exam_skill
    format: missing_point
    status: reviewed
    spec_point: "2.1.2 specialist techniques"
    concept: pop-rivet-technique
    command: describe
    scenario: steel-bracket
    see: "#joining-and-reforming-metals"
    exam_question:
      text: "Describe how a pop rivet joins the two parts of the bracket."
      marks: 2
    sample_answer: "A hole is drilled through both parts and the rivet is pushed in."
    text: "This answer gets 1 mark. Which point would earn the missing mark?"
    options:
      - text: "Adding that the rivet gun pulls the mandrel, expanding the rivet behind the parts until the mandrel snaps off"
      - text: "Adding that the rivet is made of brass spelter"
        why_wrong: "Spelter is brazing filler, so this is wrong."
      - text: "Adding that flux is applied first"
        why_wrong: "Flux is used in brazing, not riveting."
      - text: "Adding that it makes a temporary joint"
        why_wrong: "Pop rivets make a permanent joint, so this would be wrong."
    answer: 0
    explanation: "The description is only complete once it says how the rivet holds: the mandrel is pulled and the rivet expands on the far side."

  - id: tech-022
    type: exam_skill
    format: command_word
    status: reviewed
    spec_point: "2.1.2 specialist techniques"
    concept: compare-technique
    command: compare
    context: true
    see: "#3d-printing"
    exam_question:
      text: "Compare 3D printing and injection moulding for making 10 prototype parts."
      marks: 4
    text: "Which answer actually compares the two processes?"
    options:
      - text: "3D printing builds parts layer by layer."
        why_wrong: "This describes one process only."
      - text: "Injection moulding has very fast cycle times."
        why_wrong: "This describes one process only."
      - text: "3D printing is slower per part, but it needs no expensive mould, so for 10 prototypes it costs far less than injection moulding."
      - text: "Both are used to make polymer parts."
        why_wrong: "A similarity alone, with no differences weighed up for this job, is too thin for 4 marks."
    answer: 2
