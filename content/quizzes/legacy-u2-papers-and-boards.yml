  - id: papers-016
    type: exam_skill
    format: missing_point
    status: draft
    spec_point: "2.1.2 papers and boards"
    concept: waxing-technique
    command: describe
    context: true
    see: "#folding-ability-and-absorbency"
    exam_question:
      text: "Describe why card sandwich containers are waxed on the inside."
      marks: 2
    sample_answer: "To stop the card absorbing."
    text: "This answer gets 1 mark. Which point would earn the missing mark?"
    options:
      - text: "Adding what it would absorb, and the result: moisture from the sandwich, so the card would go soggy"
      - text: "Adding that the containers are die cut and flat-packed"
        why_wrong: "True, but it's about how they're made, not why they're waxed."
      - text: "Adding that wax makes the card shiny"
        why_wrong: "The wax is there to resist moisture, not for looks, so this earns nothing."
      - text: "Adding that card is made from wood pulp"
        why_wrong: "This doesn't add anything about why the wax is needed."
    answer: 0
    explanation: "A describe answer needs detail. Saying what's absorbed and what would happen completes the point."

