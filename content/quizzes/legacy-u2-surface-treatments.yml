  - id: surface-017
    type: exam_skill
    format: missing_point
    status: reviewed
    spec_point: "2.1.2 surface treatments"
    concept: preparation-technique
    command: describe
    see: "#metal-surface-treatments"
    exam_question:
      text: "Describe why a metal surface must be prepared before a finish is applied."
      marks: 2
    sample_answer: "To remove dirt from it."
    text: "This answer gets 1 mark. Which point would earn the missing mark?"
    options:
      - text: "Adding that grease and rust are removed too, so the finish grips and doesn't peel off"
      - text: "Adding that it can then be galvanised"
        why_wrong: "Naming a finish doesn't describe why preparation matters."
      - text: "Adding that metal is magnetic"
        why_wrong: "Magnetism has nothing to do with surface preparation."
      - text: "Adding that it makes the metal lighter"
        why_wrong: "Cleaning doesn't change the weight in any useful way, and that isn't the reason."
    answer: 0
    explanation: "The missing detail is the consequence: a clean, keyed surface lets the finish grip instead of peeling."

  - id: surface-018
    type: exam_skill
    format: command_word
    status: reviewed
    spec_point: "2.1.2 surface treatments"
    concept: evaluate-technique
    command: evaluate
    context: true
    see: "#surface-treatment-of-timbers"
    exam_question:
      text: "Evaluate the use of paint as the only finish for a softwood garden fence."
      marks: 4
    text: "Which answer actually evaluates?"
    options:
      - text: "Paint is colourful."
        why_wrong: "A single point, with nothing weighed up."
      - text: "Paint comes in gloss, matt or silk."
        why_wrong: "This describes paint but doesn't judge it for a fence."
      - text: "Paint adds colour and some protection, but a preservative or pressure treatment protects outdoor timber for longer, so the fence should be treated first."
      - text: "Paint is the best finish."
        why_wrong: "A judgement with no reasons isn't an evaluation."
