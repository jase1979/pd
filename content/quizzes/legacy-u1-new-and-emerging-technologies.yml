  - id: tech1-020
    type: exam_skill
    format: command_word
    status: reviewed
    spec_point: "2.1.1 new and emerging technologies"
    concept: explain-technique
    command: explain
    context: true
    see: "#cadcam--advantages-and-disadvantages"
    exam_question:
      text: "Explain why a company might choose CAM to make 10,000 identical parts."
      marks: 2
    text: "Which of these answers explains, rather than just describes?"
    options:
      - text: "CAM stands for computer-aided manufacture."
        why_wrong: "A definition isn't a reason."
      - text: "CAM machines need regular maintenance."
        why_wrong: "This is a disadvantage, not a reason to choose CAM."
      - text: "CAM gives consistent quality, so all 10,000 parts will come out identical."
      - text: "CAM is used in factories."
        why_wrong: "This describes where CAM is used, not why it suits this job."
    answer: 2
    explanation: "Explain means give a reason: a feature of CAM, and what it means for this job."
