    concept: decline-technique
    command: describe
    see: "#product-life-cycle"
    exam_question:
      text: "Describe the decline stage of the product life cycle."
      marks: 2
    sample_answer: "Sales drop off."
    text: "This answer gets 1 mark. Which point would earn the missing mark?"
    options:
      - text: "Adding that the product is no longer desired, so the maker may stop it or replace it with a new version"
      - text: "Adding that sales reach their peak"
        why_wrong: "That's the maturity stage, so it would contradict the answer."
      - text: "Adding that the product is launched onto the market"
        why_wrong: "That's the introduction stage."
      - text: "Adding that sales steadily increase"
        why_wrong: "That's the growth stage."
