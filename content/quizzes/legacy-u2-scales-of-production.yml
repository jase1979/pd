  - id: scale-018
    type: exam_skill
    format: missing_point
    status: draft
    spec_point: "2.1.2 scales of production"
    concept: mass-disadvantage-technique
    command: describe
    see: "#scales-of-production"
    exam_question:
      text: "Describe one disadvantage of mass production."
      marks: 2
    sample_answer: "It is expensive to set up."
    text: "This answer gets 1 mark. Which point would earn the missing mark?"
    options:
      - text: "Adding that once the line is set up there's little flexibility, so changing the design is costly"
      - text: "Adding that all the products are identical"
        why_wrong: "Identical products are a feature, usually an advantage, so this doesn't develop the disadvantage."
      - text: "Adding that materials are bought in bulk"
        why_wrong: "Buying in bulk is an advantage of mass production."
      - text: "Adding that it needs fewer workers"
        why_wrong: "Needing fewer workers is an advantage for the manufacturer."
    answer: 0
    explanation: "A describe answer needs development. Adding the consequence, inflexibility once set up, earns the second mark."

  - id: scale-019
    type: exam_skill
    format: command_word
    status: draft
    spec_point: "2.1.2 scales of production"
    concept: discuss-technique
    command: discuss
    context: true
    see: "#producing-products-in-papers-cards-and-boards"
    exam_question:
      text: "Discuss whether a small business should use offset lithography or digital printing for 200 leaflets."
      marks: 4
    text: "Which answer actually discusses the choice?"
    options:
      - text: "Offset lithography uses CMYK inks."
        why_wrong: "This is a single fact, with no weighing up of the two processes."
      - text: "Offset lithography gives high quality, but its plates are expensive and slow to set up, so for only 200 leaflets digital printing would be cheaper and quicker."
      - text: "Digital printing is used for short runs."
        why_wrong: "A single fact. A discussion looks at both options."
      - text: "I would use digital printing."
        why_wrong: "A decision with no reasons isn't a discussion."
    answer: 1
    explanation: "Discuss means weigh up both sides and reach a reasoned view. Here: lithography's strength, its drawback, and so the conclusion."
