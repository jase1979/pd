  - id: energy1-019
    type: exam_skill
    format: command_word
    status: draft
    spec_point: "2.1.1 energy"
    concept: compare-technique
    command: compare
    context: true
    see: "#advantages-and-disadvantages-of-renewable-energy"
    exam_question:
      text: "Compare wind and tidal energy for generating electricity."
      marks: 4
    text: "Which answer actually compares the two?"
    options:
      - text: "Wind turbines can harm birds."
        why_wrong: "This describes wind only."
      - text: "Tidal energy is around 80% efficient."
        why_wrong: "This describes tidal only."
      - text: "Both are renewable, but tidal is more efficient and predictable, while wind only works when it's windy and turbines can harm birds."
      - text: "They are both expensive."
        why_wrong: "A similarity alone isn't enough for 4 marks. A comparison needs differences too."
    answer: 2
    explanation: "Compare means show how two things are alike and how they differ, using words like 'both', 'but', 'more… than'."
