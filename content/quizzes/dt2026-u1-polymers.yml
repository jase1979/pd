  - id: dt26-poly-013
    type: multi
    status: reviewed
    spec_point: "1.1.24"
    concept: biopolymer-drawbacks
    command: identify
    see: "#biopolymers-compared-with-synthetic-oil-based-polymers"
    text: "Select TWO disadvantages of biopolymers such as PLA."
    options:
      - text: "Many only compost in industrial facilities"
      - text: "They are often less heat resistant"
      - text: "They come from finite crude oil"
        why_wrong: "Biopolymers come from renewable crops."
      - text: "They always have a higher carbon footprint"
        why_wrong: "Their carbon footprint is usually lower."
    answer: [0, 1]
    explanation: "PLA softens at about 60°C, many biopolymers need industrial composting, they cost more, and the crops use farmland."

  - id: dt26-poly-014
    status: reviewed
    spec_point: "1.1.24"
    concept: biodegradable-myth
    command: describe
    context: true
    see: "#biopolymers-compared-with-synthetic-oil-based-polymers"
    text: "A PLA cup is labelled 'compostable'. What happens if it's put in the normal plastic recycling bin?"
    options:
      - text: "It can contaminate the plastic recycling"
      - text: "It is recycled into a new PLA cup"
        why_wrong: "Normal plastic recycling isn't set up for PLA."
      - text: "It composts in the bin"
        why_wrong: "Most PLA needs the high temperatures of industrial composting."
      - text: "It turns into ABS"
        why_wrong: "Polymers don't change type in a bin."
    answer: 0
    explanation: "'Biodegradable' doesn't mean it breaks down anywhere, and biopolymers can contaminate normal recycling."

  - id: dt26-poly-015
    type: two_tier
    status: reviewed
    spec_point: "1.1.24"
    concept: uv-protection
    command: explain
    scenario: garden-chair
    see: "#how-surface-treatments-and-finishes-prolong-material-life"
    text: "What is the biggest threat to the chairs' appearance and life outdoors?"
    options:
      - text: "UV light"
      - text: "Rust"
        why_wrong: "Polymers don't rust."
      - text: "Woodworm"
        why_wrong: "Woodworm attacks timber, not polymers."
      - text: "Electricity"
        why_wrong: "Electricity isn't a threat to garden furniture."
    answer: 0
    reason:
      text: "How can it be reduced?"
      options:
        - text: "Adding UV stabilisers or a UV-resistant coating"
        - text: "Painting the chairs with primer only"
          why_wrong: "Primer alone doesn't protect against UV."
        - text: "Making them from a thermoset"
          why_wrong: "The notes give UV stabilisers and coatings as the answer."
        - text: "Polishing the edges"
          why_wrong: "Polishing edges helps against cracking from nicks, not UV."
      answer: 0
    explanation: "UV light makes many polymers fade and become brittle. UV stabilisers and coatings slow this down."

  - id: dt26-poly-016
    status: reviewed
    spec_point: "1.1.24"
    concept: self-finishing
    command: describe
    scenario: bluetooth-speaker
    see: "#how-surface-treatments-and-finishes-prolong-material-life"
    text: "Why does the injection-moulded speaker casing usually need no extra finish?"
    options:
      - text: "Polymers are self-finishing: shape, colour and texture come from the mould"
      - text: "It will be painted later anyway"
        why_wrong: "Most injection mouldings aren't painted."
      - text: "Polymers can't be finished"
        why_wrong: "They can be, but often don't need to be."
      - text: "It will rust otherwise"
        why_wrong: "Polymers don't rust."
    answer: 0
    explanation: "The mould gives the casing its colour and surface texture, so no further finish is needed."

