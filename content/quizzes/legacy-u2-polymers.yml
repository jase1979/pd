  - id: polymers-016
    type: exam_skill
    format: missing_point
    status: reviewed
    spec_point: "2.1.2 polymers"
    concept: difference-technique
    command: describe
    see: "#differences-between-thermoforming-and-thermosetting"
    exam_question:
      text: "Describe one difference between thermoforming and thermosetting polymers."
      marks: 2
    sample_answer: "Thermoforming polymers can be reheated and reshaped."
    text: "This answer gets 1 mark. Which point would earn the missing mark?"
    options:
      - text: "Adding that thermosetting polymers can't be reheated or reshaped once they've set"
      - text: "Adding that thermoforming polymers are used for car headlights"
        why_wrong: "An example use doesn't describe a difference between the two types."
      - text: "Adding that both are polymers made of long molecule chains"
        why_wrong: "That's a similarity, not a difference."
      - text: "Adding that thermosetting polymers are hard"
        why_wrong: "Some thermoforming polymers are hard too, so this isn't a clear difference."
    answer: 0
    explanation: "A difference needs both sides. Saying what thermosets do, compared with thermoforming polymers, completes it."

  - id: polymers-017
    type: exam_skill
    format: command_word
    status: reviewed
    spec_point: "2.1.2 polymers"
    concept: compare-technique
    command: compare
    context: true
    see: "#thermoforming-polymers"
    exam_question:
      text: "Compare acrylic and polycarbonate as materials for a pair of safety glasses."
      marks: 2
    text: "Which of these answers actually compares the two materials?"
    options:
      - text: "Acrylic is hard and transparent."
        why_wrong: "This only describes one material, so nothing is compared."
      - text: "Polycarbonate is used for riot shields and roof sheeting."
        why_wrong: "This gives uses of one material, not a comparison."
      - text: "Both are transparent, but polycarbonate is far tougher and more impact resistant, so it's safer for safety glasses."
      - text: "Polycarbonate is extremely tough."
        why_wrong: "This describes polycarbonate alone. A comparison needs both materials."
