    see: "#apple"
    text: "Which development did Apple bring to the mass market with the Lisa and Macintosh?"
    options:
      - text: "The graphical user interface (GUI), with icons and a mouse-controlled cursor"
      - text: "The thumb-operated joystick"
        why_wrong: "That was Shigeru Miyamoto's N64 controller."
      - text: "Cyclonic vacuum technology"
        why_wrong: "That was James Dyson."
      - text: "The first touchscreen"
        why_wrong: "The notes credit Apple with popularising the GUI on the Lisa and Macintosh."
    answer: 0
    explanation: "The GUI was developed at Xerox PARC, but Apple's Lisa and Macintosh brought icons, folders and a mouse-controlled cursor to the mass market."

