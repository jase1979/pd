        why_wrong: "That's Orla Kiely."
      - text: "Cyclonic technology"
        why_wrong: "That's James Dyson."
      - text: "Video game characters"
        why_wrong: "That's Shigeru Miyamoto."
    answer: 0
    explanation: "Bethan Gray uses brass, marble, solid wood and leather, mixing traditional craft with modern techniques."

