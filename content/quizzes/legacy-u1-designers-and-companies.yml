scenarios:
  - id: eco-fashion
    text: "A student is designing a fashion collection with a much-reduced environmental impact, and is researching designers for inspiration."
  - id: new-gadget
    text: "A start-up is developing a new handheld games console and wants it to be instantly recognisable and easy to control."

questions:

  - id: design1-001
    status: reviewed
    spec_point: "2.1.1 designers and companies"
    concept: dyson-iteration
    command: state
    context: true
    see: "#james-dyson"
    text: "How many iterations did James Dyson's DC01 vacuum cleaner go through before success?"
    options:
      - text: "5,127"
      - text: "12"
        why_wrong: "Far more: the DC01 went through 5,127 iterations over about 10 years."
      - text: "500"
        why_wrong: "Far more: 5,127."
      - text: "51,270"
        why_wrong: "Ten times too many: it was 5,127."
    answer: 0
    explanation: "The DC01 went through 5,127 iterations with rigorous testing over 10 years before it gained market approval."

  - id: design1-002
    status: reviewed
    spec_point: "2.1.1 designers and companies"
    concept: dyson-cyclone
    command: identify
    context: true
    see: "#james-dyson"
    text: "What technology did Dyson introduce to vacuum cleaners?"
    options:
      - text: "Cyclonic technology that collects dust without a bag"
      - text: "A graphical user interface"
        why_wrong: "That was popularised by Apple."
      - text: "Lightweight composite wings"
        why_wrong: "That's Airbus."
      - text: "A thumb-operated joystick"
        why_wrong: "That's Shigeru Miyamoto's N64 controller."
    answer: 0
    explanation: "Dyson replaced the dust bag with cyclonic technology that spins dust out of the air."

  - id: design1-003
    status: reviewed
    spec_point: "2.1.1 designers and companies"
    concept: ball-barrow
    command: describe
    context: true
    see: "#james-dyson"
    text: "Why did Dyson's ball barrow move more easily over soft ground than a normal wheelbarrow?"
    options:
      - text: "The ball spread the load, so it didn't sink in"
      - text: "It had an electric motor"
        why_wrong: "It wasn't motorised. The ball spread the load."
      - text: "It was made from titanium"
        why_wrong: "Material wasn't the innovation. The ball shape was."
      - text: "It had two wheels"
        why_wrong: "It had a single ball in place of a wheel."
    answer: 0
    explanation: "Replacing the narrow wheel with a ball spread the load, so the barrow didn't dig into soft ground."

  - id: design1-004
    type: two_tier
    status: reviewed
    spec_point: "2.1.1 designers and companies"
    concept: biomimicry
    command: explain
    context: true
    see: "#airbus"
    text: "The A380's wing design is based on eagles' wings. What is this an example of?"
    options:
      - text: "Biomimicry"
      - text: "Planned obsolescence"
        why_wrong: "Planned obsolescence is designing a product to last a set time."
      - text: "Biometrics"
        why_wrong: "Biometrics identify people from biological features. Biomimicry copies nature's solutions."
      - text: "Incremental development"
        why_wrong: "Incremental development is small improvements between models."
    answer: 0
    reason:
      text: "What does it mean?"
      options:
        - text: "Copying nature to solve design problems"
        - text: "Identifying people from their biological features"
          why_wrong: "That's biometrics."
        - text: "Designing products to wear out"
          why_wrong: "That's planned obsolescence."
        - text: "Making products from natural materials"
          why_wrong: "Biomimicry copies nature's forms and structures. It isn't about natural materials."
      answer: 0
    explanation: "Biomimicry is nature solving design problems: the A380's wing shape copies the structure of eagles' wings."

  - id: design1-005
    status: reviewed
    spec_point: "2.1.1 designers and companies"
    concept: airbus-materials
    command: describe
    context: true
    see: "#airbus"
    text: "Why is titanium used for some 3D-printed Airbus parts?"
    options:
      - text: "It has an excellent strength to weight ratio"
      - text: "It is the cheapest metal"
        why_wrong: "Titanium is expensive. It's chosen for strength to weight."
      - text: "It changes colour in sunlight"
        why_wrong: "That's a photochromic material."
      - text: "It is very soft and easy to bend"
        why_wrong: "Titanium is strong, not soft."
    answer: 0
    explanation: "Aircraft need to be strong but light, and titanium has an excellent strength to weight ratio."

  - id: design1-006
    status: reviewed
    spec_point: "2.1.1 designers and companies"
    concept: airbus-composites
    command: state
    context: true
    see: "#airbus"
    text: "How did Airbus overcome the weight issues of the A380?"
    options:
      - text: "By using lightweight composite materials"
      - text: "By carrying fewer passengers"
        why_wrong: "It still carries up to 800 passengers."
      - text: "By making the wings shorter"
        why_wrong: "Wing tips were added to limit the wingspan for airports, not to cut weight."
      - text: "By using solid steel throughout"
        why_wrong: "Steel is heavy. Composites were used to save weight."
    answer: 0
    explanation: "The A380 was built using lightweight composite materials to overcome weight issues."

