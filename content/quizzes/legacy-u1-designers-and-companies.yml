  - id: design1-017
    type: exam_skill
    format: best_answer
    status: reviewed
    spec_point: "2.1.1 designers and companies"
    concept: iteration-technique
    command: explain
    see: "#james-dyson"
    exam_question:
      text: "Explain why James Dyson made so many prototypes of the DC01."
      marks: 2
    text: "Which answer would get full marks?"
    options:
      - text: "He liked making things."
        marks_awarded: 0
        why_wrong: "Not a design reason."
      - text: "To test his design."
        marks_awarded: 1
        why_wrong: "A correct point earns 1 mark, but it doesn't say why testing mattered."
      - text: "Each prototype was tested and improved, so the final product worked reliably and was good enough to succeed on the market."
        marks_awarded: 2
    answer: 2
    explanation: "Full marks: testing and improving, linked to the outcome, a product that succeeded."

