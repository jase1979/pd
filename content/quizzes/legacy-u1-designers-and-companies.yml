  - id: design1-011
    type: multi
    status: reviewed
    spec_point: "2.1.1 designers and companies"
    concept: apple-identity
    command: identify
    scenario: new-gadget
    see: "#apple"
    text: "The start-up wants a design identity like Apple's. Select TWO features of Apple's design approach."
    options:
      - text: "Consistent colours, shapes and materials"
      - text: "Sleek styling where aesthetics matter"
      - text: "Bold hand-painted floral prints"
        why_wrong: "That's closer to Orla Kiely or Laura Ashley."
      - text: "Rough, unfinished surfaces"
        why_wrong: "Apple's designs are sleek and refined."
    answer: [0, 1]
    explanation: "Apple products are sleek, with consistent colours, shapes and materials that make them easily recognisable."

