  - id: dt26-metals-019
    type: exam_skill
    format: command_word
    status: reviewed
    spec_point: "1.1.22"
    concept: compare-technique
    command: compare
    see: "#ferrous-metals-mild-steel-stainless-steel-and-high-carbon-steel"
    exam_question:
      text: "Compare mild steel and high carbon steel."
      marks: 4
    text: "Which answer actually compares them?"
    options:
      - text: "Mild steel is used for car bodies."
        why_wrong: "This only describes one metal."
      - text: "High carbon steel contains more carbon than mild steel, so it is harder and keeps an edge, whereas mild steel is tougher and easier to bend."
      - text: "Both are metals."
        why_wrong: "Too general to be a comparison."
      - text: "High carbon steel is better."
        why_wrong: "A judgement isn't a comparison."
    answer: 1
    explanation: "Compare means set out similarities and differences, using words like 'whereas' and 'but'."
