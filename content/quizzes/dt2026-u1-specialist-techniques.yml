    status: draft
    spec_point: "1.1.26"
    concept: injection-moulding
    command: identify
    scenario: phone-casing
    see: "#industrial-manufacturing-processes-for-metals-woods-and-plastics"
    text: "Which industrial process should be used to make the 200,000 casings?"
    options:
      - text: "Injection moulding"
      - text: "Vacuum forming"
        why_wrong: "Vacuum forming makes simple shapes like trays, not detailed casings."
      - text: "Blow moulding"
        why_wrong: "Blow moulding makes hollow bottles and containers."
      - text: "3D printing"
        why_wrong: "3D printing is far too slow for 200,000 parts."
    answer: 0
    explanation: "Injection moulding forces molten polymer into a closed mould, making complex, high-volume products such as casings."

