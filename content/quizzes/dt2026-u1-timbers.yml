    concept: absorbency
    command: identify
    context: true
    see: "#physical-and-working-properties-of-timber"
    text: "A boat builder needs a board that resists water. Which should they use?"
    options:
      - text: "Marine plywood"
      - text: "MDF"
        why_wrong: "MDF is very absorbent and swells."
      - text: "Balsa"
        why_wrong: "Balsa is light and floats, but it's soft and weak as a structural board."
      - text: "Standard interior plywood"
        why_wrong: "Interior grades aren't made to resist water."
    answer: 0
    explanation: "Marine and exterior grades of plywood are made to resist water."

