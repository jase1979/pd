    exam_question:
      text: "Describe what is meant by 'kerf' when cutting timber."
      marks: 2
    sample_answer: "It is the saw cut."
    text: "This answer gets 1 mark. Which point would earn the missing mark?"
    options:
      - text: "Adding that it's the width of timber the blade removes, which must be allowed for when working out lengths"
      - text: "Adding that it's measured in microns"
        why_wrong: "Microns measure board thickness. Kerf is usually given in millimetres."
      - text: "Adding that it means planed with squared edge"
        why_wrong: "That's PSE, a timber finish."
      - text: "Adding that it's a type of wood joint"
        why_wrong: "Kerf isn't a joint. It's the material the saw removes."
    answer: 0
    explanation: "The detail that earns the mark: kerf is the width of material removed by the blade, so it's lost from the length."

  - id: stock-017
    type: exam_skill
    format: command_word
    status: draft
    spec_point: "2.1.2 stock forms"
    concept: calculate-technique
    command: calculate
    context: true
    see: "#calculating-quantities-and-costs"
    exam_question:
      text: "Calculate how many 200 mm pieces can be cut from a 1000 mm length of timber, allowing 3 mm for each saw cut."
      marks: 2
    text: "Which answer does what 'calculate' asks?"
    options:
      - text: "About 5."
        why_wrong: "An estimate with no working won't get full marks, and it's wrong once the kerf is included."
      - text: "200 + 3 = 203 mm per piece. 1000 ÷ 203 = 4.93, so 4 pieces."
      - text: "You need to allow for the kerf."
        why_wrong: "This describes what to do but doesn't work out the answer."
      - text: "1000 ÷ 200 = 5, so 5 pieces."
        why_wrong: "This shows working but ignores the 3 mm kerf the question gives."
    answer: 1
    explanation: "Calculate means work out a value, showing your working and using every figure the question gives."
