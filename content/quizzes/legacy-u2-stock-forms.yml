scenarios:
  - id: flatpack-shelf
    text: "A company makes flat-pack bookshelves from MDF. Customers assemble them at home, and may want to take them apart again when they move."
  - id: picture-frames
    text: "A small workshop cuts 2400 mm lengths of pine into 400 mm pieces to make picture frames. Each saw cut removes 3 mm of timber (the kerf)."

questions:

  - id: stock-001
    type: multi
    status: draft
    spec_point: "2.1.2 stock forms"
    concept: metal-stock-forms
    command: identify
    see: "#stock-forms-for-metals"
    text: "Select TWO stock forms that metals are supplied in."
    options:
      - text: "Hexagonal rod"
      - text: "Angle"
      - text: "Dowel"
        why_wrong: "Dowel is a sectional form of timber, not metal."
      - text: "PSE"
        why_wrong: "PSE (planed with squared edge) describes how timber is finished."
    answer: [0, 1]
    explanation: "Metals come as round, square and hexagonal rods, strips, sheets, round and square tubes, angle and channel."

  - id: stock-002
    status: draft
    spec_point: "2.1.2 stock forms"
    concept: pse
    command: state
    see: "#stock-forms-of-timber"
    text: "Timber is often sold as 'PSE'. What does PSE mean?"
    options:
      - text: "Planed with squared edge"
      - text: "Plastic sheet, extruded"
        why_wrong: "PSE is a timber term, not a polymer stock form."
      - text: "Pre-sawn edge"
        why_wrong: "PSE timber is planed, giving smooth faces and square edges, not just sawn."
      - text: "Pressed softwood element"
        why_wrong: "That isn't a real term. PSE means planed with squared edge."
    answer: 0
    explanation: "PSE means planed with squared edge: smooth faces and square edges, ready to use."

  - id: stock-003
    status: draft
    spec_point: "2.1.2 stock forms"
    concept: sawn-vs-planed
    command: describe
    see: "#stock-forms-of-timber"
    text: "How does planed timber differ from sawn timber?"
    options:
      - text: "Planed timber has smooth faces; sawn timber is left rough from the saw"
      - text: "Planed timber is a manufactured board; sawn timber is natural"
        why_wrong: "Both are natural timber. The difference is the surface finish."
      - text: "Sawn timber is always a hardwood; planed timber is always a softwood"
        why_wrong: "Hardwoods and softwoods can both be sold sawn or planed."
      - text: "There is no difference"
        why_wrong: "There is: sawn timber is rough, planed timber has been smoothed."
    answer: 0
    explanation: "Timber can be bought sawn (rough from the saw) or planed (smoothed), for example PSE, which saves time when making."

