    text: "A drawer base is made from hardboard. What thickness is hardboard usually supplied in?"
    options:
      - text: "3.2 mm"
      - text: "18 mm"
        why_wrong: "18 mm is a common thickness of MDF and plywood, not hardboard."
      - text: "25 mm"
        why_wrong: "25 mm is a thick MDF size. Hardboard is a thin sheet."
      - text: "12 mm"
        why_wrong: "12 mm is an MDF or plywood thickness."
    answer: 0
    explanation: "Hardboard is a thin board, usually 3.2 mm. MDF and plywood come in thicknesses from 4 mm up to about 25 mm."

  - id: stock-006
    status: draft
    spec_point: "2.1.2 stock forms"
    concept: parts-per-sheet
    command: calculate
    scenario: flatpack-shelf
    see: "#calculating-quantities-and-costs"
    text: "Shelf brackets measuring 300 mm × 200 mm are cut from a half sheet of MDF (1220 mm × 610 mm). How many can be cut, laid out in rows?"
    options:
      - text: "12"
      - text: "12.4"
        why_wrong: "This divides one area by the other. You can't cut part of a bracket, and the layout must fit in rows."
      - text: "20"
        why_wrong: "Both divisions were rounded up. A bracket that only partly fits can't be cut, so always round down."
      - text: "15"
        why_wrong: "1220 ÷ 300 = 4.07 was rounded up to 5. Only 4 whole brackets fit along the length."
    answer: 0
    working: |
      Along the length: 1220 ÷ 300 = 4.07, so 4 brackets (round down).
      Along the width: 610 ÷ 200 = 3.05, so 3 brackets.
      Brackets per half sheet: 4 × 3 = 12.
    explanation: "Divide each side separately and round each down: you can't use part of a part. Then multiply."

  - id: stock-007
    status: draft
    spec_point: "2.1.2 stock forms"
    concept: cost-per-part
    command: calculate
    scenario: flatpack-shelf
    see: "#calculating-quantities-and-costs"
    text: "A half sheet of MDF costs £12.00 and makes 12 shelf brackets. What is the material cost of one bracket?"
    options:
      - text: "£1.00"
      - text: "£0.50"
        why_wrong: "That would be true if the sheet made 24 brackets. Divide the cost by 12 here."
      - text: "£144.00"
        why_wrong: "The cost was multiplied by the number of brackets instead of divided."
      - text: "£12.00"
        why_wrong: "That's the cost of the whole sheet, not of one bracket."
    answer: 0
    working: |
      Cost per part = sheet cost ÷ parts per sheet
      = £12.00 ÷ 12 = £1.00.
    explanation: "Divide the cost of the sheet by the number of parts it makes."

  - id: stock-008
    status: draft
    spec_point: "2.1.2 stock forms"
    concept: kerf-calc
    command: calculate
    scenario: picture-frames
    see: "#calculating-quantities-and-costs"
    text: "How many whole 400 mm pieces can be cut from one 2400 mm length?"
    options:
      - text: "5"
      - text: "6"
        why_wrong: "2400 ÷ 400 = 6 ignores the kerf. Each cut removes 3 mm, so each piece uses 403 mm."
      - text: "5.95"
        why_wrong: "You can't cut part of a piece. Round down to 5."
      - text: "7"
        why_wrong: "Rounding up is never right here: there isn't enough timber for even 6 pieces once the kerf is allowed for."
    answer: 0
    working: |
      Length used per piece = 400 + 3 (kerf) = 403 mm.
      2400 ÷ 403 = 5.95, so 5 whole pieces (round down).
    explanation: "Add the kerf to each piece before dividing, then round down."

  - id: stock-009
    status: draft
    spec_point: "2.1.2 stock forms"
    concept: waste-calc
    command: calculate
    scenario: picture-frames
    see: "#calculating-quantities-and-costs"
    text: "After cutting 5 pieces (each using 403 mm including the kerf), how much of the 2400 mm length is left as waste?"
    options:
      - text: "385 mm"
      - text: "400 mm"
        why_wrong: "This ignores the 3 mm lost to each cut: 2400 − (5 × 400) = 400."
      - text: "0 mm"
        why_wrong: "Without the kerf, 6 pieces would fit exactly. With it, only 5 fit and there's waste."
      - text: "15 mm"
        why_wrong: "15 mm is just the total kerf (5 × 3 mm), not the leftover length."
    answer: 0
    working: |
      Length used = 5 × 403 = 2015 mm.
      Waste = 2400 − 2015 = 385 mm.
    explanation: "Waste is the original length minus everything used, including the kerf for each cut."

