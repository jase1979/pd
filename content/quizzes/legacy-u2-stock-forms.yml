      - text: "Cam lock fittings"
      - text: "Drawing pins"
        why_wrong: "Drawing pins are fittings for papers and boards, far too weak for furniture."
      - text: "Treasury tags"
        why_wrong: "Treasury tags hold sheets of paper together."
      - text: "Welding"
        why_wrong: "Welding is a permanent joint for metals. MDF panels can't be welded."
    answer: 0
    reason:
      text: "Why is it the best choice?"
      options:
        - text: "Panels can be assembled, and taken apart again, with simple tools"
        - text: "It makes a permanent joint"
          why_wrong: "Knock-down fittings are chosen because they aren't permanent."
        - text: "It is a fitting designed for papers and card"
          why_wrong: "Cam locks are furniture fittings. Paper fittings include staples and treasury tags."
        - text: "It is only decorative"
          why_wrong: "Cam locks hold the panels together. They're functional."
      answer: 0
    explanation: "Cam locks are knock-down fittings: customers can assemble the shelves at home and take them apart again."

