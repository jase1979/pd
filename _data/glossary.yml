- term: "Market Pull"
  definition: "When consumer demand drives the development of a new product or technology."
  level: "GCSE"
  source: "/gcse/unit1/new-and-emerging-technologies/"

- term: "Technology Push"
  definition: "When new technology drives the creation of products that consumers did not previously know they needed."
  level: "GCSE"
  source: "/gcse/unit1/new-and-emerging-technologies/"

- term: "Product Life Cycle"
  definition: "The stages a product goes through from introduction to decline: Introduction, Growth, Maturity, Decline."
  level: "GCSE"
  source: "/gcse/unit1/new-and-emerging-technologies/"

- term: "BSI"
  definition: "British Standards Institute — sets standards for products to ensure safety and quality."
  level: "GCSE"
  source: "/gcse/unit1/new-and-emerging-technologies/"

- term: "ISO"
  definition: "International Standards Organisation — sets internationally agreed standards for products and processes."
  level: "GCSE"
  source: "/gcse/unit1/new-and-emerging-technologies/"

- term: "Sustainability"
  definition: "Meeting today's needs without compromising the ability of future generations to meet their own needs."
  level: "GCSE"
  source: "/gcse/unit1/ecological-footprint/"

- term: "Six Rs"
  definition: "The six principles of sustainability: Rethink, Reuse, Recycle, Repair, Reduce, Refuse."
  level: "GCSE"
  source: "/gcse/unit1/ecological-footprint/"

- term: "Life Cycle Analysis"
  definition: "A method to determine the environmental impact of a product from cradle to grave — from raw material extraction through to disposal."
  level: "GCSE"
  source: "/gcse/unit1/critical-evaluation/"

- term: "Carbon Footprint"
  definition: "The total amount of greenhouse gases produced to support human activities, expressed as carbon dioxide equivalent."
  level: "GCSE"
  source: "/gcse/unit1/critical-evaluation/"

- term: "Design Obsolescence"
  definition: "When a product is intentionally designed to become outdated or unfashionable after a period of time, encouraging consumers to buy a replacement."
  level: "GCSE"
  source: "/gcse/unit1/critical-evaluation/"

- term: "CAD"
  definition: "Computer Aided Design — using computer software to create 2D or 3D designs of products."
  level: "GCSE"
  source: "/gcse/unit1/new-and-emerging-technologies/"

- term: "CAM"
  definition: "Computer Aided Manufacture — using computer-controlled machines to manufacture products."
  level: "GCSE"
  source: "/gcse/unit1/new-and-emerging-technologies/"

- term: "Shape Memory Alloy"
  definition: "A metal alloy (e.g. Nitinol) that returns to its original shape when heated after being deformed."
  level: "GCSE"
  source: "/gcse/unit1/modern-smart-materials/"

- term: "Thermochromic"
  definition: "A material that changes colour in response to changes in temperature."
  level: "GCSE"
  source: "/gcse/unit1/modern-smart-materials/"

- term: "Photochromic"
  definition: "A material that changes colour in response to changes in light intensity."
  level: "GCSE"
  source: "/gcse/unit1/modern-smart-materials/"

- term: "Polymorph"
  definition: "A thermoplastic material that becomes mouldable at low temperatures (around 62°C) and can be reshaped many times."
  level: "GCSE"
  source: "/gcse/unit1/modern-smart-materials/"

- term: "Ferrous Metal"
  definition: "A metal that contains iron, such as mild steel, medium carbon steel, and high carbon steel. Ferrous metals are generally magnetic and prone to rust."
  level: "GCSE"
  source: "/gcse/unit2/metals/"

- term: "Non-Ferrous Metal"
  definition: "A metal that does not contain iron, such as aluminium, copper, and brass. Non-ferrous metals are generally non-magnetic and more resistant to corrosion."
  level: "GCSE"
  source: "/gcse/unit2/metals/"

- term: "Alloy"
  definition: "A mixture of two or more metals, or a metal and another element, to improve properties. Examples: brass (copper + zinc), steel (iron + carbon)."
  level: "GCSE"
  source: "/gcse/unit2/material-properties/"

- term: "Thermoforming Polymer"
  definition: "A plastic that can be repeatedly softened by heating and reshaped, e.g. acrylic, polypropylene, ABS, PVC."
  level: "GCSE"
  source: "/gcse/unit2/polymers/"

- term: "Thermosetting Polymer"
  definition: "A plastic that is permanently set during manufacture and cannot be re-melted or reshaped, e.g. urea formaldehyde, melamine, epoxy resin."
  level: "GCSE"
  source: "/gcse/unit2/polymers/"

- term: "Injection Moulding"
  definition: "A process in which molten thermoforming polymer is forced under high pressure into a closed mould, then pushed out by ejector pins once cool. Used for high-volume production of complex shapes."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "Vacuum Forming"
  definition: "A process where a heated thermoplastic sheet is stretched over a mould and air is removed to form the shape."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "Hardwood"
  definition: "Timber from broad-leaved, deciduous trees (e.g. oak, beech). Generally harder and more durable but slower growing."
  level: "GCSE"
  source: "/gcse/unit2/timber/"

- term: "Softwood"
  definition: "Timber from coniferous, evergreen trees (e.g. Scots pine, western red cedar). Generally easier to work and cheaper than hardwood."
  level: "GCSE"
  source: "/gcse/unit2/timber/"

- term: "MDF"
  definition: "Medium Density Fibreboard — a manufactured timber board made from compressed wood fibres and resin. Smooth surface, no grain, easy to cut."
  level: "GCSE"
  source: "/gcse/unit2/timber/"

- term: "GSM"
  definition: "Grams per square metre — the unit used to measure the weight/thickness of paper and board."
  level: "GCSE"
  source: "/gcse/unit2/papers-and-boards/"

- term: "Batch Production"
  definition: "Manufacturing a set quantity of identical products. Each batch goes through each stage of production before the next batch begins."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "One-Off Production"
  definition: "Manufacturing a single unique product to a customer's individual requirements. Also called bespoke or job production."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "High Volume Production"
  definition: "Continuous manufacture of large quantities of identical products using automated machinery. Also called mass production."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "Jig"
  definition: "A device that holds a workpiece in position and guides a cutting tool to ensure accuracy and repeatability in production."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "Quantum Tunnelling Composite"
  definition: "QTC — a smart material whose electrical resistance decreases significantly when compressed, used in switches and sensors."
  level: "GCSE"
  source: "/gcse/unit2/smart-materials/"

- term: "Nitinol"
  definition: "A shape memory alloy made from nickel and titanium that returns to a predetermined shape when heated."
  level: "GCSE"
  source: "/gcse/unit2/smart-materials/"

- term: "Fair Trade"
  definition: "A trading partnership that aims to achieve greater equity in international trade, ensuring fair wages and good working conditions for producers in developing countries."
  level: "GCSE"
  source: "/gcse/unit1/ecological-footprint/"

- term: "Bronze"
  definition: "An alloy of copper and tin that is hard, corrosion resistant and has low friction, used for bearings, statues and marine fittings."
  level: "GCSE"
  source: "/gcse/unit2/metals/"

- term: "Stainless Steel"
  definition: "An alloy of iron, chromium and nickel that resists stains and corrosion, used for cutlery, sinks and hospital equipment."
  level: "GCSE"
  source: "/gcse/unit2/metals/"

- term: "Pewter"
  definition: "A soft alloy of mainly tin with small amounts of copper and antimony, with a very low melting point that makes it ideal for casting in school."
  level: "GCSE"
  source: "/gcse/unit2/metals/"

- term: "Medium Carbon Steel"
  definition: "A ferrous metal with about 0.35–0.7% carbon that is stronger and harder than mild steel and can be hardened and tempered."
  level: "GCSE"
  source: "/gcse/unit2/metals/"

- term: "Elasticity"
  definition: "The ability of a material to bend or stretch under a force and return to its original shape when the force is removed."
  level: "GCSE"
  source: "/gcse/unit2/metals/"

- term: "Plasticity"
  definition: "The ability of a material to be permanently changed in shape without cracking, keeping its new shape once the force is removed."
  level: "GCSE"
  source: "/gcse/unit2/metals/"

- term: "Tempering"
  definition: "A heat treatment in which hardened steel is reheated to a lower temperature, judged by its oxide colour, and quenched to reduce brittleness while keeping most of its hardness."
  level: "GCSE"
  source: "/gcse/unit2/material-properties/"

- term: "Polycarbonate"
  definition: "A transparent, extremely tough and impact-resistant thermoforming polymer used for safety glasses, riot shields and roof sheeting."
  level: "GCSE"
  source: "/gcse/unit2/polymers/"

- term: "Extruded Polystyrene (Styrofoam)"
  definition: "A dense, fine-celled polystyrene foam, often blue, that is easy to cut and shape and is used for modelling and insulation."
  level: "GCSE"
  source: "/gcse/unit2/smart-materials/"

- term: "Expanded Polystyrene (EPS)"
  definition: "A lightweight white foam made from expanded polystyrene beads, used for protective packaging and insulation."
  level: "GCSE"
  source: "/gcse/unit2/polymers/"

- term: "Duplex Board"
  definition: "A cheaper board with a white coated top layer and a grey, often recycled, back, used for food packaging such as cereal boxes."
  level: "GCSE"
  source: "/gcse/unit2/papers-and-boards/"

- term: "Solid White Board"
  definition: "A high-quality board bleached all the way through, giving a bright white surface that prints well, used for premium packaging."
  level: "GCSE"
  source: "/gcse/unit2/papers-and-boards/"

- term: "Bleed Proof Paper"
  definition: "A smooth, coated paper that stops marker pen ink from spreading, used for marker renderings and design work."
  level: "GCSE"
  source: "/gcse/unit2/papers-and-boards/"

- term: "Ejector Pin"
  definition: "A pin in an injection moulding machine that pushes the cooled product out of the mould, leaving a small circular mark."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "Draft Angle"
  definition: "A slight taper on the sides of a moulded product that allows it to be released from the mould."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "Offset Lithography"
  definition: "A high-volume printing process in which an inked image is transferred from a plate to a rubber blanket and then onto paper, relying on oil and water not mixing."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "CMYK"
  definition: "The four process inks used to print colour images: cyan, magenta, yellow and key (black)."
  level: "GCSE"
  source: "/gcse/unit2/scales-of-production/"

- term: "Veneering"
  definition: "Gluing a very thin slice of attractive timber onto a cheaper, stable base such as MDF, chipboard or plywood."
  level: "GCSE"
  source: "/gcse/unit2/specialist-techniques/"

- term: "Laminating (wood)"
  definition: "Gluing thin strips or veneers of wood together and clamping them around a former so they set in a strong curved shape."
  level: "GCSE"
  source: "/gcse/unit2/specialist-techniques/"

- term: "Steam Bending"
  definition: "Softening solid timber in a steam box, then bending it around a former and clamping it until it dries and keeps its new shape."
  level: "GCSE"
  source: "/gcse/unit2/specialist-techniques/"

- term: "Line Bending"
  definition: "Heating a narrow line across a thermoforming polymer sheet with a strip heater so it can be bent to an angle."
  level: "GCSE"
  source: "/gcse/unit2/specialist-techniques/"

- term: "Plastic Dip Coating"
  definition: "Dipping heated metal into a fluidised bed of polythene powder that melts onto it, giving a soft, coloured, protective coating."
  level: "GCSE"
  source: "/gcse/unit2/surface-treatments/"

- term: "Cropping"
  definition: "Trimming printed sheets to their final size along the crop marks, removing the excess bleed."
  level: "GCSE"
  source: "/gcse/unit2/specialist-techniques/"

- term: "Kerf"
  definition: "The width of material removed by a saw cut, which must be allowed for when calculating how many pieces can be cut from stock."
  level: "GCSE"
  source: "/gcse/unit2/stock-forms/"

- term: "Knock-Down Fitting"
  definition: "A fitting such as a cam lock, corner block or scan fitting that lets flat-pack furniture be assembled and taken apart."
  level: "GCSE"
  source: "/gcse/unit2/specialist-techniques/"

- term: "Cross-Link"
  definition: "A permanent chemical bond formed between the molecule chains of a thermosetting polymer when it sets, which stops it being softened or remoulded."
  level: "GCSE"
  source: "/gcse/unit2/polymers/"

# ── Terms introduced by the 2026 specification (Unit 1 core) ────────────────

- term: "Smart Material"
  definition: "A material whose properties change in a controlled, usually reversible way in response to an external stimulus such as heat, light, pressure, moisture or electricity."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/modern-smart-materials/"

- term: "Modern Material"
  definition: "A material developed through new or improved processes, designed to have properties that traditional materials cannot offer."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/modern-smart-materials/"

- term: "Biometrics"
  definition: "Technology that identifies a person from a unique biological characteristic such as a fingerprint, face, iris or voice."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/modern-smart-materials/"

- term: "Circular Economy"
  definition: "An economic model in which materials are kept in use for as long as possible through reuse, repair, remanufacture and recycling, instead of being thrown away."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/sustainable-design/"

- term: "Trade Descriptions Act"
  definition: "Legislation making it illegal to describe goods falsely or misleadingly, whether on packaging, in advertising or by a salesperson."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/sustainable-design/"

- term: "Planned Obsolescence"
  definition: "Also called built-in obsolescence — deliberately designing a product with a limited useful life so the consumer has to replace it."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/sustainable-design/"

- term: "Renewable Energy"
  definition: "Energy from a source that is naturally replaced as fast as it is used, so it will not run out."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/energy/"

- term: "Non-Renewable Energy"
  definition: "Energy from a finite source that cannot be replaced within a human timescale. Once used, it is gone."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/energy/"

- term: "Design Brief"
  definition: "A short statement of what is to be designed, for whom and why, agreed between the designer and the client."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/design-thinking/"

- term: "Design Specification"
  definition: "A detailed list of criteria the design must meet, written from research findings. Good specification points are measurable."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/design-thinking/"

- term: "User Centred Design"
  definition: "An approach that puts the needs, wants and abilities of the end user at the centre of every design decision, involving them throughout rather than only at the end."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/design-thinking/"

- term: "Working Drawing"
  definition: "An accurate, dimensioned technical drawing giving all the information needed to make a product, including sizes, tolerances, materials and finishes."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/design-thinking/"

- term: "Quality Control"
  definition: "Checking and testing products during and after manufacture to make sure they meet the specification. Quality control finds faulty products; quality assurance designs the process so faults are less likely."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/design-thinking/"

- term: "Ergonomics"
  definition: "Designing products, systems and environments so they fit the people who use them, and are comfortable, safe and efficient to use."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/design-thinking/"

- term: "Anthropometrics"
  definition: "The collection and use of measurement data about the human body, used to make ergonomic decisions. Designers work from percentile data rather than averages."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/design-thinking/"

- term: "Biomimicry"
  definition: "Designing by imitating the forms, processes and systems found in nature, which have been refined by evolution."
  level: "D&T 2026"
  level_id: "dt2026"
  source: "/gcse-2026/unit1/core/design-thinking/"
