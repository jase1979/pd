---
layout: default
title: Flashcards
---
<style>
.fc-page {
  max-width: 800px;
  margin: 2rem auto;
  padding: 0 1rem;
}

.fc-header {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}

.fc-header h1 {
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--text);
  flex: 1;
  min-width: 120px;
}

.fc-top-controls {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  flex-wrap: wrap;
}

#fc-topic-select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 0.5rem 0.8rem;
  font-size: 0.9rem;
  cursor: pointer;
  max-width: 280px;
}
#fc-topic-select:focus { outline: 2px solid var(--accent); }

.fc-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 0.45rem 0.9rem;
  font-size: 0.85rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.fc-btn:hover { background: var(--surface-hover); color: var(--text); }

/* Progress bar */
.fc-progress-wrap {
  margin-bottom: 1.5rem;
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.fc-progress-bar {
  flex: 1;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.fc-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.3s;
  width: 0%;
}
.fc-progress-label {
  font-size: 0.8rem;
  color: var(--text-muted);
  white-space: nowrap;
}

/* Card arena */
.fc-arena {
  perspective: 1200px;
  margin-bottom: 1.25rem;
}

.fc-card {
  width: 100%;
  min-height: 260px;
  cursor: pointer;
  position: relative;
}

.fc-card-inner {
  width: 100%;
  min-height: 260px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
}

.fc-card.flipped .fc-card-inner {
  transform: rotateY(180deg);
}

.fc-front,
.fc-back {
  position: absolute;
  width: 100%;
  min-height: 260px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 2.5rem;
  text-align: center;
  border: 1px solid var(--border);
}

.fc-front {
  background: var(--surface);
}

.fc-back {
  background: var(--surface-hover);
  transform: rotateY(180deg);
}

.fc-side-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin-bottom: 1rem;
  align-self: flex-start;
}

.fc-front .fc-side-label { color: var(--accent); }
.fc-back .fc-side-label { color: var(--gcse); }

.fc-term {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.3;
}

.fc-definition {
  font-size: 1rem;
  color: var(--text);
  line-height: 1.6;
  max-width: 560px;
}

.fc-hint {
  text-align: center;
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 1.25rem;
}

/* Navigation row */
.fc-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  margin-bottom: 1rem;
}

.fc-nav-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 8px;
  padding: 0.6rem 1.2rem;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
  flex-shrink: 0;
}
.fc-nav-btn:hover:not(:disabled) { background: var(--surface-hover); color: var(--text); }
.fc-nav-btn:disabled { opacity: 0.35; cursor: default; }

.fc-action-btns {
  display: flex;
  gap: 0.6rem;
  flex: 1;
  justify-content: center;
}

.fc-known-btn,
.fc-unknown-btn {
  border: none;
  border-radius: 8px;
  padding: 0.6rem 1.4rem;
  font-size: 0.9rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
}
.fc-known-btn { background: #1a3a2a; color: #4caf8a; border: 1px solid #2a5a3a; }
.fc-unknown-btn { background: #3a1a1a; color: #e05555; border: 1px solid #5a2a2a; }
.fc-known-btn:hover { opacity: 0.85; }
.fc-unknown-btn:hover { opacity: 0.85; }
.fc-known-btn.active { background: #2a5a3a; color: #6fd4a6; }

/* Counter */
.fc-counter {
  text-align: center;
  font-size: 0.8rem;
  color: var(--text-muted);
}

/* Empty state */
.fc-empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-muted);
  border: 1px dashed var(--border);
  border-radius: 14px;
}

@media (max-width: 540px) {
  .fc-term { font-size: 1.2rem; }
  .fc-definition { font-size: 0.9rem; }
  .fc-front, .fc-back { padding: 1.5rem 1.2rem; min-height: 220px; }
  .fc-card, .fc-card-inner { min-height: 220px; }
  .fc-action-btns { flex-direction: column; }
}
</style>

{% comment %}Embed all flashcard data as a JS object{% endcomment %}
<script>
const FC_DATA = {
  {% for topic in site.data.flashcards %}
  {{ topic[0] | jsonify }}: {{ topic[1] | jsonify }}{% unless forloop.last %},{% endunless %}
  {% endfor %}
};
</script>

<div class="fc-page">
  <div class="fc-header">
    <h1>Flashcards</h1>
    <div class="fc-top-controls">
      <select id="fc-topic-select" aria-label="Select topic"></select>
      <button class="fc-btn" id="fc-shuffle-btn">⇄ Shuffle</button>
      <button class="fc-btn" id="fc-reset-btn">↺ Reset</button>
    </div>
  </div>

  <div class="fc-progress-wrap">
    <div class="fc-progress-bar"><div class="fc-progress-fill" id="fc-progress-fill"></div></div>
    <span class="fc-progress-label" id="fc-progress-label">0 / 0 known</span>
  </div>

  <div class="fc-arena">
    <div class="fc-card" id="fc-card" role="button" tabindex="0" aria-label="Flashcard — click to flip">
      <div class="fc-card-inner" id="fc-card-inner">
        <div class="fc-front">
          <span class="fc-side-label">Term</span>
          <span class="fc-term" id="fc-front-text">Select a topic to begin</span>
        </div>
        <div class="fc-back">
          <span class="fc-side-label">Definition</span>
          <p class="fc-definition" id="fc-back-text"></p>
        </div>
      </div>
    </div>
  </div>

  <p class="fc-hint" id="fc-hint">Click the card to reveal the definition</p>

  <div class="fc-nav">
    <button class="fc-nav-btn" id="fc-prev-btn" disabled>← Prev</button>
    <div class="fc-action-btns">
      <button class="fc-known-btn" id="fc-known-btn">✓ Know it</button>
      <button class="fc-unknown-btn" id="fc-unknown-btn">✗ Still learning</button>
    </div>
    <button class="fc-nav-btn" id="fc-next-btn" disabled>Next →</button>
  </div>

  <p class="fc-counter">Card <span id="fc-idx">—</span> of <span id="fc-total">—</span></p>
</div>

<script>
(function () {
  // ── Topic registry — generated from _data/nav.yml at build time ─────────────
  const UNITS = [
    {% for unit in site.data.nav %}
    {% comment %}"/gcse-2026/unit1/core/" → "gcse-2026-unit1-core" (the URL path, so every unit and topic key is unique){% endcomment %}
    {% assign _prefix    = unit.url | remove_first: "/" | split: "/" | join: "-" %}
    {% assign _level_meta = site.data.levels | where: "id", unit.level | first %}
    {
      label:         {{ unit.label          | jsonify }},
      level:         {{ unit.level          | jsonify }},
      level_display: {{ _level_meta.display | jsonify }},
      prefix: {{ _prefix | jsonify }},
      topics: [
        {% for topic in unit.topics %}
        {% comment %}"/gcse/unit1/energy/" → "gcse-unit1-energy" — matches _data/flashcards/gcse-unit1-energy.json{% endcomment %}
        {% assign _fc_key  = topic.url | remove_first: "/" | split: "/" | join: "-" %}
        { key: {{ _fc_key | jsonify }}, label: {{ topic.title | jsonify }} }{% unless forloop.last %},{% endunless %}
        {% endfor %}
      ]
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  // ── State ───────────────────────────────────────────────────────────────────
  let deck = [];          // current shuffled/ordered array of card objects
  let deckIdx = 0;
  let isFlipped = false;
  let knownIds = new Set();
  try { knownIds = new Set(JSON.parse(localStorage.getItem('fc_known') || '[]')); } catch (e) {}

  // ── Elements ─────────────────────────────────────────────────────────────────
  const sel       = document.getElementById('fc-topic-select');
  const cardEl    = document.getElementById('fc-card');
  const frontText = document.getElementById('fc-front-text');
  const backText  = document.getElementById('fc-back-text');
  const prevBtn   = document.getElementById('fc-prev-btn');
  const nextBtn   = document.getElementById('fc-next-btn');
  const knownBtn  = document.getElementById('fc-known-btn');
  const unknownBtn= document.getElementById('fc-unknown-btn');
  const shuffleBtn= document.getElementById('fc-shuffle-btn');
  const resetBtn  = document.getElementById('fc-reset-btn');
  const idxEl     = document.getElementById('fc-idx');
  const totalEl   = document.getElementById('fc-total');
  const fill      = document.getElementById('fc-progress-fill');
  const progLabel = document.getElementById('fc-progress-label');
  const hintEl    = document.getElementById('fc-hint');

  // ── Build topic <select> grouped by level ────────────────────────────────────
  function buildSelect() {
    // Group units by level (preserving order)
    var levelIds = [], levelMap = {};
    UNITS.forEach(function (unit) {
      if (!levelMap[unit.level]) {
        levelMap[unit.level] = { display: unit.level_display, units: [] };
        levelIds.push(unit.level);
      }
      levelMap[unit.level].units.push(unit);
    });

    levelIds.forEach(function (levelId) {
      var info = levelMap[levelId];
      var grp  = document.createElement('optgroup');
      grp.label = info.display;

      // "All [Level]" option
      var allOpt = document.createElement('option');
      allOpt.value = '__level__' + levelId;
      allOpt.textContent = 'All ' + info.display;
      grp.appendChild(allOpt);

      info.units.forEach(function (unit) {
        // Skip units with no decks (e.g. the NEA guide, or topics not yet written)
        var hasCards = unit.topics.some(function (t) { return FC_DATA[t.key] && FC_DATA[t.key].length; });
        if (!hasCards) return;

        // Unit separator (disabled)
        var sep = document.createElement('option');
        sep.disabled = true;
        sep.textContent = '— ' + unit.label;
        grp.appendChild(sep);

        // Individual topics
        unit.topics.forEach(function (t) {
          var cards = FC_DATA[t.key];
          if (!cards || !cards.length) return;
          var opt = document.createElement('option');
          opt.value = t.key;
          opt.textContent = t.label + ' (' + cards.length + ')';
          grp.appendChild(opt);
        });
      });

      sel.appendChild(grp);
    });
  }

  // ── Load deck from selected option ──────────────────────────────────────────
  function loadDeck(value) {
    var cards = [];
    if (value.startsWith('__level__')) {
      // All cards for a level
      var levelId = value.slice(9);
      UNITS.forEach(function (unit) {
        if (unit.level === levelId) {
          unit.topics.forEach(function (t) {
            var c = FC_DATA[t.key];
            if (c) cards = cards.concat(c);
          });
        }
      });
    } else if (value.startsWith('__')) {
      // All cards for a unit prefix
      var prefix = value.slice(2);
      UNITS.forEach(function (unit) {
        if (unit.prefix === prefix) {
          unit.topics.forEach(function (t) {
            var c = FC_DATA[t.key];
            if (c) cards = cards.concat(c);
          });
        }
      });
    } else {
      cards = FC_DATA[value] || [];
    }
    deck = cards.slice(); // copy
    deckIdx = 0;
    showCard();
  }

  // ── Fisher–Yates shuffle ──────────────────────────────────────────────────
  function shuffle(arr) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    return arr;
  }

  // ── Render current card ───────────────────────────────────────────────────
  function showCard() {
    setFlipped(false);
    if (!deck.length) {
      frontText.textContent = 'No cards available for this topic.';
      backText.textContent = '';
      idxEl.textContent = '—';
      totalEl.textContent = '—';
      prevBtn.disabled = true;
      nextBtn.disabled = true;
      updateProgress();
      return;
    }
    var card = deck[deckIdx];
    frontText.textContent = card.front;
    backText.textContent  = card.back;
    idxEl.textContent    = deckIdx + 1;
    totalEl.textContent  = deck.length;
    prevBtn.disabled = deckIdx === 0;
    nextBtn.disabled = deckIdx === deck.length - 1;
    // highlight known button if this card is known
    knownBtn.classList.toggle('active', knownIds.has(card.id));
    updateProgress();
  }

  function setFlipped(state) {
    isFlipped = state;
    cardEl.classList.toggle('flipped', state);
    hintEl.textContent = state
      ? 'Know it? Use the buttons below'
      : 'Click the card to reveal the definition';
  }

  function updateProgress() {
    // Count known cards in current deck
    var known = deck.filter(function (c) { return knownIds.has(c.id); }).length;
    var total = deck.length;
    var pct = total ? Math.round((known / total) * 100) : 0;
    fill.style.width = pct + '%';
    progLabel.textContent = known + ' / ' + total + ' known';
  }

  function saveKnown() {
    try { localStorage.setItem('fc_known', JSON.stringify([...knownIds])); } catch (e) {}
  }

  // ── Event listeners ───────────────────────────────────────────────────────
  cardEl.addEventListener('click', function () {
    if (!deck.length) return;
    setFlipped(!isFlipped);
  });

  cardEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cardEl.click(); }
    if (e.key === 'ArrowRight' && !nextBtn.disabled) nextBtn.click();
    if (e.key === 'ArrowLeft'  && !prevBtn.disabled) prevBtn.click();
  });

  prevBtn.addEventListener('click', function () {
    if (deckIdx > 0) { deckIdx--; showCard(); }
  });

  nextBtn.addEventListener('click', function () {
    if (deckIdx < deck.length - 1) { deckIdx++; showCard(); }
  });

  knownBtn.addEventListener('click', function () {
    if (!deck.length) return;
    var id = deck[deckIdx].id;
    knownIds.add(id);
    saveKnown();
    knownBtn.classList.add('active');
    updateProgress();
    // Auto-advance
    if (deckIdx < deck.length - 1) { setTimeout(function () { deckIdx++; showCard(); }, 350); }
  });

  unknownBtn.addEventListener('click', function () {
    if (!deck.length) return;
    var id = deck[deckIdx].id;
    knownIds.delete(id);
    saveKnown();
    knownBtn.classList.remove('active');
    updateProgress();
    if (deckIdx < deck.length - 1) { setTimeout(function () { deckIdx++; showCard(); }, 350); }
  });

  shuffleBtn.addEventListener('click', function () {
    if (!deck.length) return;
    shuffle(deck);
    deckIdx = 0;
    showCard();
  });

  resetBtn.addEventListener('click', function () {
    if (!confirm('Reset all progress for every topic?')) return;
    knownIds.clear();
    saveKnown();
    knownBtn.classList.remove('active');
    updateProgress();
  });

  sel.addEventListener('change', function () {
    loadDeck(sel.value);
  });

  // ── Init ──────────────────────────────────────────────────────────────────
  buildSelect();
  if (sel.options.length) {
    loadDeck(sel.options[0].value);
  }
})();
</script>
